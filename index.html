<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script src="index.js" defer></script>
		<title>BetterNotes | by: Lain</title>
		<style>
			* {
				box-sizing: border-box;
				font-family: sans-serif;
			}
			input,
			textarea {
				display: block;
				font-size: 1rem;
				margin-bottom: 1rem;
			}

			textarea {
				width: 100%;
			}

			input[type="checkbox"] {
				width: 20px;
				height: 20px;
				margin-right: 0.5rem;
				vertical-align: middle;
			}

			input[type="checkbox"]:hover {
				cursor: pointer;
				filter: brightness(1.2);
			}

			header {
				display: flex;
				justify-content: center;
				align-items: center;
				gap: 1rem;
			}

			h1 {
				display: inline-block;
			}

			.logo {
				display: inline-block;
				width: 60px;
			}

			img {
				overflow: hidden;
				width: 100%;
				border-radius: 50%;
			}

			button {
				display: block;
				margin-bottom: 1rem;
			}

			button:hover {
				cursor: pointer;
				filter: brightness(1.2);
			}

			#saveTicketButton {
				padding: 1rem;
			}

			.control-panel {
				border: 1px solid #000;
				padding: 1rem;
				margin-bottom: 1rem;
			}

			.switch-click {
				margin-top: 0.5rem;
				font-size: 1rem;
				padding: 0.5rem 1rem;
			}
		</style>
	</head>
	<body>
		<header>
			<h1>BetterNotes</h1>
			<div class="logo">
				<img
					src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQwi1tt9wRKB9WFZV2JVO_y9kU_Db9Sb5atdw&s"
					alt="BetterNotes Logo" />
			</div>
		</header>
		<p>ver. 1.2.2(early access)</p>

		<div class="control-panel">
			<h3><b>Sessions:</b></h3>
			<ul class="session-list"></ul>

			<h3>Current Session:</h3>
			<p id="currentSessionName"></p>

			<h4>Records in this session:</h4>
			<span id="recordCount"></span>

			<form id="createSessionForm">
				<label for="sessionName">
					Create New Session :
					<input
						type="text"
						id="sessionName"
						name="sessionName"
						placeholder="Enter session name"
						required />
				</label>

				<button type="submit">Create Session</button>
			</form>

			<h3>Session Records: Export</h3>
			<ul class="session-export-list"></ul>
		</div>

		<button id="hide-control-panel">HIDE CONTROL PANEL</button>
		<h3>New Note:</h3>

		<form id="ticketForm">
			<label>
				Employee ID:
				<input
					type="text"
					name="employeeId"
					placeholder="Enter Employee ID"
					required />
			</label>

			<label>
				First and Last Name:
				<input
					type="text"
					name="fullName"
					placeholder="Enter Full Name"
					required />
			</label>

			<label>
				User ID:
				<input type="text" name="userId" placeholder="Enter User ID" required />
			</label>

			<label>
				Email Address:
				<input
					type="email"
					name="email"
					placeholder="Enter Email Address"
					required />
			</label>

			<label>
				Contact Number:
				<input
					type="text"
					name="contactNumber"
					placeholder="Enter Contact Number"
					required />
			</label>

			<label>
				Best Time to Reach:
				<input
					type="text"
					name="bestTimeToReach"
					placeholder="Enter Best Time to Reach"
					value="8am-5pm"
					required />
			</label>

			<label>
				WFH?:
				<input type="input" name="workSetup" value="WFH" />
			</label>

			<label>
				Location:
				<input
					type="text"
					name="location"
					placeholder="Enter Location"
					required />
			</label>
			<hr />
			<hr />
			<label>
				Critical Issue?
				<input type="input" name="criticalIssue" />
			</label>

			<label>
				Existing Ticket?
				<input type="input" name="existingTicket" />
			</label>

			<label>
				Existing Ticket Number:
				<input
					type="text"
					name="existingTicketNumber"
					placeholder="Enter Ticket Number"
					default="N/A"
					value="N/A"
					required />
			</label>

			<label>
				SSPR?
				<input type="input" name="sspr" />
			</label>

			<label>
				Nexthink?
				<input type="input" name="nexthink" />
			</label>

			<label>
				Non-AD Password Reset via Chat?
				<input type="input" name="nonAdPasswordReset" />
			</label>
			<hr />
			<hr />
			<label>
				New Hire:
				<input type="input" name="newHire" />
			</label>

			<label>
				MFA Registered:
				<input type="input" name="mfaRegistered" />
			</label>

			<label>
				SSPR Offered?:
				<input type="input" name="ssprOffered" />
			</label>

			<label>
				User declined:
				<input type="input" name="userDeclined" />
			</label>

			<label>
				User declined:
				<textarea name="userDeclinedReason">N/A</textarea>
			</label>

			<label>
				User attempted SSPR but failed:
				<input type="input" name="userAttemptedSsprFailed" />
			</label>

			<label>
				Failure Details:
				<textarea name="ssprFailureDetails">N/A</textarea>
			</label>

			<hr />
			<hr />
			<label>
				Issue Description:
				<textarea
					name="issueDescription"
					rows="5"
					cols="50"
					placeholder="Describe the issue"
					required></textarea>
			</label>

			<label>
				Minimum Data Set:
				<textarea
					name="minimumDataSet"
					rows="5"
					cols="50"
					placeholder="Enter minimum data set"
					required></textarea>
			</label>
			<hr />
			<hr />
			<label>
				KB Article:
				<input
					type="text"
					name="kbArticle"
					placeholder="Enter KB Article"
					required />
			</label>

			<label>
				Next Action(s):
				<textarea
					name="nextActions"
					rows="4"
					cols="50"
					placeholder="Enter next actions"
					required></textarea>
			</label>

			<label>
				Issue Resolved?
				<input type="input" name="issueResolved" />
			</label>

			<label>
				User agreed to set ticket to Resolved?
				<input type="iput" name="userAgreedResolved" />
			</label>

			<label>
				Ticket Number:
				<input
					type="text"
					name="ticketNumber"
					placeholder="Enter Ticket Number"
					value="N/A"
					required />
			</label>

			<label>
				Resolution Notes:
				<input
					type="text"
					name="resolutionNotes"
					placeholder="Enter Resolution Notes"
					value="N/A"
					required />
			</label>

			<button type="submit" id="saveTicketButton">Save Ticket</button>
			<button type="button" id="cancelButton">Cancel</button>
			<button type="button" id="newNoteButton">New Note</button>
		</form>

		<hr />
		<footer>
			<p>
				BetterNotes &copy; 2026 | GitHub:
				<a href="https://github.com/Lain-lies/betterNotes" target="_blank"
					>BetterNotes</a
				>
			</p>
		</footer>
	</body>
</html>
